apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neural-fabric
  namespace: codex-warlab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neural-fabric
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70