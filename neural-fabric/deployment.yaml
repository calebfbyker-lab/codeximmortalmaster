apiVersion: apps/v1
kind: Deployment
metadata:
  name: neural-fabric
  namespace: codex-warlab
  labels:
    app.kubernetes.io/name: neural-fabric
    app.kubernetes.io/version: "1.0.0"
    codex.warlab/layer: mn-net
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neural-fabric
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neural-fabric
        app.kubernetes.io/version: "1.0.0"
        codex.warlab/layer: mn-net
    spec:
      serviceAccountName: neural-fabric
      securityContext:
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: neural-fabric
      containers:
        - name: neural-fabric
          image: ghcr.io/example/neural-fabric:latest
          ports:
            - containerPort: 8092
          readinessProbe:
            httpGet:
              path: /health
              port: 8092
          livenessProbe:
            httpGet:
              path: /health
              port: 8092
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"