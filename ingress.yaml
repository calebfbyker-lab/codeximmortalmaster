apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codex-warlab
  namespace: codex-warlab
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["codex.local"]
      secretName: codex-tls
  rules:
    - host: codex.local
      http:
        paths:
          - path: /api/v1/agents
            pathType: Prefix
            backend:
              service:
                name: neural-fabric
                port:
                  number: 8092
          - path: /api/v1/threats
            pathType: Prefix
            backend:
              service:
                name: threat-board
                port:
                  number: 8095