name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (advisory until baseline is clean)
        run: ruff check . --exit-zero

      # Root unit tests only; tests/ holds integration suites that need
      # live service dependencies and runs separately.
      - name: Pytest
        run: python -m pytest -q test_*.py

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect secrets
        run: |
          python -m pip install detect-secrets
          detect-secrets scan --all-files > .secrets.baseline
          echo "Secret scan baseline generated for review"

  pqc-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PQC modules reference approved algorithms
        run: |
          if grep -RnE "RSA|ECDSA|Ed25519" pqc_signer_oqs.py signer.py validator.py; then
            echo "::warning::Classical crypto reference found in PQC modules"
          else
            echo "PQC spine clean"
          fi
