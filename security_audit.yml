name: security-audit

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  weekly-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom pip-audit

      - name: Generate SBOM
        run: cyclonedx-py environment --output-file sbom.json

      - name: Dependency vulnerability scan
        run: pip-audit || true

      - name: Red team placeholder
        run: echo "Run red team scripts against staging here"