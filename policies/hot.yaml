ringname: hot
sensitivity: UNCLASSIFIED
replication:
  factor: 2
  strategy: mirrored
  geozones: ["us-east", "us-central"]
encryption:
  algorithm: ML-KEM-1024-envelope
  key_id: hot-ring-key
  rotation_cron: "0 0 * * *"
